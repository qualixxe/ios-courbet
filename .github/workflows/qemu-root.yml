name: qemu-root

# Build the small journaled HFS+ test root for QEMU boots, following the
# ios-sweet recipe (NOTES.md: "64 MB journaled test root, rd=md0 rootrw=1"):
#   dd 64M -> mkfs.hfsplus -s -J -v sweetroot -> mount -o loop,force ->
#   /sbin/launchd = tools/sweet-init.S wrapped by tools/mkinit.py ->
#   umount. Linux hfsplus never touches the journal, so the image boots
#   NeedInit just like the full 16 GB rootfs: QEMU runs
#   hfs_early_journal_init -> journal_create at boot.
#
# fsck.hfsplus -n is ADVISORY here: upstream NOTES documents the quirk
# "Volume header needs minor repair on any fresh journaled volume even
# after -y", so a non-zero rc is recorded but does not fail the build.
#
# The image (gzip: mostly zeros -> tiny) and the full build log are pushed
# to the single-commit branch "qemu-root-artifact" with the workflow's
# GITHUB_TOKEN, so the result is fetchable with plain `git fetch` (Actions
# artifact downloads need an API token that may not be available locally).

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sweet-init.S'
      - 'tools/mkinit.py'
      - '.github/workflows/qemu-root.yml'

permissions:
  contents: write

concurrency:
  group: qemu-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the port
        uses: actions/checkout@v4

      - name: Install host tools (hfsprogs)
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs

      - name: Ensure hfsplus filesystem support
        run: |
          set -euxo pipefail
          K=$(uname -r)
          if ! sudo modprobe hfsplus 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$K"
            sudo depmod -a "$K"
            sudo modprobe hfsplus
          fi
          grep hfsplus /proc/filesystems
          echo "hfsplus OK for kernel $K"

      - name: Build sweet-init (the QEMU /sbin/launchd)
        run: |
          set -eux
          clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o "$RUNNER_TEMP/sweet-init.o"
          python3 tools/mkinit.py "$RUNNER_TEMP/sweet-init.o" "$RUNNER_TEMP/sweet-init"
          file "$RUNNER_TEMP/sweet-init"

      - name: Build the 64 MB journaled test root
        run: |
          exec > >(tee build-output.log) 2>&1
          set -eux
          trap 'echo BUILD_FAILED; sudo dmesg | tail -n 40' ERR
          echo "STAGE dd"
          dd if=/dev/zero of=qemu-root.img bs=1M count=64 status=none
          echo "STAGE mkfs"
          mkfs.hfsplus -s -J -v sweetroot qemu-root.img
          echo "STAGE mount"
          work="$RUNNER_TEMP/qemuroot"
          mkdir -p "$work"
          sudo mount -t hfsplus -o loop,force qemu-root.img "$work"
          echo "STAGE populate"
          sudo mkdir -p "$work/sbin" "$work/dev" "$work/private/var"
          sudo cp "$RUNNER_TEMP/sweet-init" "$work/sbin/launchd"
          sudo chmod 755 "$work/sbin/launchd"
          echo "STAGE umount"
          sudo umount "$work"
          echo "STAGE fsck-y"
          fsck.hfsplus -f -y qemu-root.img | grep -v 'Illegal name' || true
          echo "STAGE fsck-n"
          fsck.hfsplus -f -n qemu-root.img || echo "FSCK_N_RC=$? (advisory quirk, not fatal)"
          echo "STAGE hash"
          sha256sum qemu-root.img
          echo "BUILD_OK"

      - name: Pack and push to qemu-root-artifact branch
        if: always()
        run: |
          set -ux
          gzip -kf qemu-root.img || true
          git config user.name "qemu-root ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qemu-root.img.gz build-output.log || true
          git commit -m "qemu-root run ${{ github.run_id }}" || true
          git push origin HEAD:refs/heads/qemu-root-artifact --force
